[package]
name = "biomeos-boot"
version.workspace = true
edition.workspace = true
authors = ["BiomeOS Contributors"]
description = "Pure Rust boot infrastructure for BiomeOS"
license.workspace = true
rust-version.workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["net", "fs", "rt"] }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Structured logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

# System interaction (pure Rust via rustix)
rustix = { workspace = true, features = ["fs", "mount", "process"] }

# Filesystem operations
tar = { workspace = true }
flate2 = { workspace = true }

# Path and file utilities
tempfile = { workspace = true }

# CLI parsing
clap = { workspace = true, features = ["cargo"] }

# Date/time
chrono = { workspace = true }

# Process utilities
which = { workspace = true }

# BiomeOS crates
biomeos-types = { path = "../biomeos-types" }
biomeos-core = { path = "../biomeos-core" }

[dev-dependencies]
tokio-test = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
biomeos-test-utils = { path = "../biomeos-test-utils" }

[[bin]]
name = "biomeos-init"
path = "src/bin/init.rs"

[[bin]]
name = "biomeos-mkboot"
path = "src/bin/mkboot.rs"

[[bin]]
name = "biomeos-rootfs"
path = "src/bin/biomeos-rootfs.rs"

# NOTE: Profile configuration moved to workspace root Cargo.toml
# (non-root profile sections are ignored by cargo)

[lints]
workspace = true
