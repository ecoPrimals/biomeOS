[package]
name = "biomeos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "BiomeOS CLI tools for system management, discovery, and monitoring"
authors = ["BiomeOS Team"]

[[bin]]
name = "biome"
path = "src/bin/main.rs"
doc = false  # Avoid collision with biomeos-unibin

[[bin]]
name = "verify-lineage"
path = "src/bin/verify-lineage.rs"

[dependencies]
biomeos-core = { path = "../biomeos-core" }
biomeos-primal-sdk = { path = "../biomeos-primal-sdk" }
biomeos-types = { path = "../biomeos-types" }
biomeos-chimera = { path = "../biomeos-chimera" }
biomeos-spore = { path = "../biomeos-spore" }
biomeos-federation = { path = "../biomeos-federation" }
biomeos-genomebin-v3 = { path = "../biomeos-genomebin-v3", version = "3.0.0" }
clap = { workspace = true, features = ["color"] }
tokio = { workspace = true, features = ["net", "io-util", "fs"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
chrono = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
# dirs removed — pure Rust via $HOME env resolution

[dev-dependencies]
biomeos-test-utils = { path = "../biomeos-test-utils" }
toml = { workspace = true }
# Testing HTTP client - for benchmarks comparing Tower atomic vs HTTP
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
