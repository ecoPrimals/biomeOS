[package]
name = "biomeos-unibin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "biomeOS Universal Nucleus & Orchestrator - UniBin"
authors = ["biomeOS Team"]

[[bin]]
name = "biomeos"
path = "src/main.rs"

[dependencies]
# Mode implementations (as libraries)
biomeos-api = { path = "../biomeos-api" }
biomeos-atomic-deploy = { path = "../biomeos-atomic-deploy" }
biomeos-core = { path = "../biomeos-core" }
biomeos-types = { path = "../biomeos-types" }
biomeos-spore = { path = "../biomeos-spore" }
biomeos-graph = { path = "../biomeos-graph" }
biomeos-genomebin-v3 = { path = "../biomeos-genomebin-v3", version = "3.0.0" }

# CLI framework
clap = { workspace = true, features = ["color"] }

# Async runtime
tokio = { workspace = true, features = ["net", "io-util", "fs", "process", "signal"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Time
chrono = { workspace = true }

# System info for doctor mode (pure Rust via /proc - ecoBin v3)
rustix = { workspace = true, features = ["fs", "process"] }

# Formatting
colored = { workspace = true }

# Encoding
base64 = { workspace = true }

# pseudoSpore envelope validation (NC-1.4)
biomeos-pseudospore = { path = "../biomeos-pseudospore" }

# tarpc dual-socket sidecar (G64 cephalization)
biomeos-primal-sdk = { path = "../biomeos-primal-sdk" }

# Cryptographic randomness
rand = { workspace = true }

[dev-dependencies]
biomeos-test-utils = { path = "../biomeos-test-utils" }
tempfile = { workspace = true }
temp-env = { workspace = true }

[lints]
workspace = true
