[package]
name = "biomeos-atomic-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Atomic graph deployment, Neural API routing, and primal lifecycle management"

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "fs", "process", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }  # For binaries
thiserror = { workspace = true }
rustix = { workspace = true, features = ["process"] }
# UID retrieval now uses rustix::process::getuid() (already a dependency, pure Rust)
# System metrics: pure Rust via /proc (ecoBin v3)
rand = { workspace = true }  # For JWT secret generation
base64 = { workspace = true }  # For JWT secret encoding
# BTSP Phase 3 crypto now via biomeos-core::btsp_crypto (hkdf, chacha20poly1305, sha2)
# zeroize now via biomeos-core::btsp_crypto (SessionKeys derives Zeroize)

# biomeOS crates
biomeos-spore = { path = "../biomeos-spore" }
biomeos-core = { path = "../biomeos-core" }
biomeos-types = { path = "../biomeos-types" }
biomeos-primal-sdk = { path = "../biomeos-primal-sdk" }
tarpc = { workspace = true, features = ["tcp"] }
tokio-serde = { workspace = true }
biomeos-graph = { path = "../biomeos-graph" }
biomeos-system = { path = "../biomeos-system" }
chrono = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }  # For request ID generation
toml = { workspace = true }  # For Neural API graph parsing
redb = { workspace = true }  # Persistent routing weights (ecoBin compliant)
dashmap = { workspace = true }  # Lock-free runtime capability → provider registry


[dev-dependencies]
biomeos-test-utils = { path = "../biomeos-test-utils" }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
temp-env = { workspace = true }
tokio-test = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
