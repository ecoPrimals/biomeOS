[package]
name = "biomeos-nucleus"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals Project"]
description = "Secure Primal Discovery Protocol (NUCLEUS) for biomeOS"
license.workspace = true
rust-version.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["net", "io-util"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Binary data
bytes = { workspace = true }

# Crypto hashing (for verification, not implementation)
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# biomeOS dependencies
biomeos-core = { path = "../biomeos-core" }
biomeos-types = { path = "../biomeos-types" }

[dev-dependencies]
biomeos-test-utils = { path = "../biomeos-test-utils" }
tokio-test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
