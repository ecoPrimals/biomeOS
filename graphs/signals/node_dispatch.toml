#
# Atomic Signal: node.dispatch
#
# Workload dispatch: toadStool selects optimal hardware target,
# coralReef compiles if shader needed, barraCuda executes.
# The general-purpose compute pipeline (node.compute is the specific case).

[graph]
id = "node_dispatch"
name = "Node Dispatch Signal"
description = "Select hardware target → optional shader compile → execute workload."
version = "1.0.0"
coordination = "sequential"
signal_tier = "node"
signal_name = "dispatch"

[graph.metadata]
particle = "proton"
security_model = "btsp_enforced"
transport = "platform_native"
secure_by_default = true
fragments = ["tower_atomic"]

[[graph.nodes]]
name = "select_target"
binary = "toadstool"
order = 1
required = true
spawn = false
by_capability = "compute"
capabilities = ["compute.dispatch"]

[[graph.nodes]]
name = "compile_shader"
binary = "coralreef"
order = 2
required = false
spawn = false
depends_on = ["select_target"]
by_capability = "shader"
capabilities = ["shader.compile.wgsl"]

[[graph.nodes]]
name = "execute_workload"
binary = "barracuda"
order = 3
required = true
spawn = false
depends_on = ["select_target"]
by_capability = "tensor"
capabilities = ["compute.execute"]
