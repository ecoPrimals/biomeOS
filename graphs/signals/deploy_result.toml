#
# Atomic Signal: deploy.result
#
# Phase 1 of deployment signaling evolution.
# After any orchestration (composition.orchestrate) or individual primal
# lifecycle event, biomeOS emits a structured deploy.result message to the
# gossip mesh via swarmVine. This enables:
#   - Fleet convergence tracking (primalSpring Phase 2 consumes)
#   - Cross-gate deployment awareness (other gates know what's running where)
#   - Failure propagation (gates learn about deployment issues without polling)
#
# Topic: "deploy.result"
# Key: "deploy.result:{gate_id}:{composition}"
# Value (JSON): { gate, node_id, composition, tiers_deployed, success, error?, timestamp, version }
# TTL: 600s (results age out after 10 minutes — superseded by next deploy)
#
# Consumers:
#   - primalSpring: fleet health dashboard, convergence checks
#   - overwatch: operational awareness
#   - Other biomeOS instances: cross-gate composition awareness

[graph]
id = "deploy_result"
name = "Deploy Result Gossip Signal"
description = "Emit deployment outcome to gossip mesh for fleet convergence"
version = "1.0.0"
coordination = "sequential"
signal_tier = "meta"
signal_name = "deploy_result"

[graph.metadata]
particle = "meta"
security_model = "btsp_enforced"
transport = "platform_native"
secure_by_default = true
composition_model = "signal"

[[graph.nodes]]
name = "emit_deploy_result"
binary = "biomeos"
order = 1
required = true
spawn = false
by_capability = "orchestration"
capabilities = ["deploy.result"]

[[graph.nodes]]
name = "gossip_broadcast"
binary = "swarmvine"
order = 2
required = false
spawn = false
depends_on = ["emit_deploy_result"]
by_capability = "gossip"
capabilities = ["gossip.advertise"]

[[graph.nodes]]
name = "convergence_update"
binary = "primalspring"
order = 3
required = false
spawn = false
depends_on = ["gossip_broadcast"]
by_capability = "integration"
capabilities = ["convergence.update", "fleet.health"]
